<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buna Land - أصالة القهوة الإثيوبية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- الهيدر -->
    <header>
        <div class="logo">Buna Land</div>
        <nav>
            <a href="#">رئيسية</a>
            <a href="#">منتجاتنا</a>
            <a href="#">من نحن</a>
            <a href="#">اتصل بنا</a>
        </nav>
    </header>

    <!-- البنر الرئيسي -->
    <section class="banner">
        <h1>أصالة القهوة الإثيوبية بين يديك</h1>
        <button>اطلب الآن</button>
    </section>

    <!-- قسم المنتجات -->
    <section class="products">
        <h2>أشهر منتجاتنا</h2>
        <div class="product-list">
            <div class="product">
                <img src="yirgacheffe.jpg" alt="بن يرجاتشيف">
                <h3>بن يرجاتشيف</h3>
                <p>45 ر.س</p>
            </div>
            <div class="product">
                <img src="sidamo.jpg" alt="بن سيدامو">
                <h3>بن سيدامو</h3>
                <p>50 ر.س</p>
            </div>
            <div class="product">
                <img src="harrar.jpg" alt="بن هرار">
                <h3>بن هرار</h3>
                <p>40 ر.س</p>
            </div>
        </div>
    </section>

    <!-- الفوتر -->
    <footer>
        <p>جميع الحقوق محفوظة © Buna Land 2026</p>
    </footer>
</body>
</html>
